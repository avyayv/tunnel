# Shared HTTP proxy. CoreDNS is optional: only started for split-DNS mode.
# External DNS (including the default nip.io domain) needs no port 53 listener.
name: tunnel-proxy

services:
  caddy:
    image: caddy:2.10.2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "${TUNNEL_PROXY_BIND:-0.0.0.0}:${TUNNEL_PROXY_PORT:-8000}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TUNNEL_PROXY_SITES}:/etc/caddy/sites:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dns:
    profiles: [split-dns]
    image: coredns/coredns:1.13.1
    command: ["-conf", "/etc/coredns/Corefile"]
    environment:
      TUNNEL_DOMAIN: ${TUNNEL_DOMAIN}
      TUNNEL_PROXY_IP: ${TUNNEL_PROXY_IP}
    ports:
      - "${TUNNEL_PROXY_BIND:-0.0.0.0}:53:53/udp"
      - "${TUNNEL_PROXY_BIND:-0.0.0.0}:53:53/tcp"
    volumes:
      - ./Corefile:/etc/coredns/Corefile:ro
    restart: unless-stopped
